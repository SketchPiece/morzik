<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Морзик</title>
<!-- Копия telegram-web-app.js лежит рядом, чтобы запуск не ждал telegram.org. -->
<script src="telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Шрифты не блокируют страницу: пока стили не пришли, нижний скрипт (полный экран, цвета) не выполнялся бы. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Unbounded:wght@600&display=swap" media="print" onload="this.media='all'">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { height: 100%; background: #10172C; color: #fff; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden }
  body {
    background: radial-gradient(120% 70% at 50% 34%, #34477C 0%, #1a2342 55%, #10172C 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    /* In fullscreen Telegram draws its Close and ⋯ buttons over the page: the content safe area keeps clear of them. */
    padding: calc(24px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)) 24px calc(56px + var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px));
    text-align: center; user-select: none; -webkit-user-select: none;
  }
  .cat { position: relative; width: min(82vw, 46vh, 360px); aspect-ratio: 1; pointer-events: none }
  .cat canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .4s }
  .cat.on canvas { opacity: 1 }
  h1 { font-family: Unbounded, Inter, sans-serif; font-weight: 600; font-size: 34px; letter-spacing: -.01em; margin-top: 8px }
  p { margin-top: 12px; font-size: 16px; line-height: 1.45; color: #b9c3e6; min-height: 1.45em }
  p.timer { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 15px; color: #8e9ac4; letter-spacing: .04em }
  .call { margin-top: 28px; width: 76px; height: 76px; border: 0; border-radius: 50%; background: #2fbf71; color: #fff;
          display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .1s; -webkit-tap-highlight-color: transparent }
  .call:active { transform: scale(.94) }
  .call svg { width: 34px; height: 34px; transition: transform .2s }
  .call.live { background: #e5484d }
  .call.live svg { transform: rotate(135deg) }
  .call:disabled { opacity: .5 }
</style>
</head>
<body>
  <div class="cat"><canvas id="head"></canvas></div>
  <h1>Морзик</h1>
  <p id="status">позвони, поболтаем</p>
  <button class="call" id="call" aria-label="Позвонить">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
  </button>
<script>
// Всё внутри функции: Telegram на iPhone встраивает в страницу свой код, и глобальный const с тем же именем
// (tg, v…) ронял весь этот скрипт ещё до запуска — ни полного экрана, ни цвета шапки, ни видео.
(() => {
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand(); tg.setHeaderColor('#10172C'); tg.setBackgroundColor('#10172C'); tg.setBottomBarColor?.('#10172C');
    // Full screen on phones (Bot API 8.0+); on a Mac or PC it would take over the whole monitor, so there it stays a window.
    if (['ios', 'android'].includes(tg.platform) && tg.isVersionAtLeast?.('8.0')) tg.requestFullscreen();
  }

})();
</script>
<!-- Живая 3D-голова Морзика (three.js), собрана из design/canvas/morzik-character/_cat2.js. -->
<script src="morzik.js"></script>
<script type="module">
// Звонок: сервер Морзика проверяет подпись Telegram (initData) и что это пользователь, выдаёт одноразовый токен
// звонка ElevenLabs и что агент должен знать (память, последняя переписка, время). Модуль — своя область
// видимости, с кодом Telegram на iPhone не пересекается.
import { Conversation } from 'https://esm.sh/@elevenlabs/client@1.30.0';

const START = 'https://sketch-server.tail923acf.ts.net/voice/start';
const tg = window.Telegram && Telegram.WebApp;
const button = document.getElementById('call'), status = document.getElementById('status');
let call = null, busy = false, mode = 'listening', thinking = false, timer = null, failed = false;

// Голова показывает состояние звонка вместо надписи: до звонка спит, на гудках просыпается, слушает, думает
// (Морзик спрашивает свой мозг, perform_task), говорит; ошибка — глаза-спиральки.
const box = document.querySelector('.cat'), canvas = document.getElementById('head');
const head = morzikCat2(canvas, { size: Math.round(box.clientWidth), headOnly: true, transparent: true, call: 'idle', callStyle: 'both' });
requestAnimationFrame(() => box.classList.add('on'));
const show = () => head.set(mode === 'speaking' ? 'speaking' : thinking ? 'thinking' : 'listening');

// Голос в звонке → рот и уши. Громкость SDK — среднее спектра 100–8000 Гц в долях 0…1; у тишины и шума свой
// уровень, поэтому он подстраивается: пол медленно ползёт вверх и падает до тишины, пик медленно спадает.
// Форма рта — по спектру голоса Морзика: сильные высокие форманты (1,7–3,5 кГц) против низких (250–900 Гц) — «и»,
// слабые — «о»/«у». Бины спектра — 1024 штуки на 100–8000 Гц.
const norm = () => { let floor = .05, peak = .3, last = 0;
  return (vol, T) => { const dt = Math.min(.1, Math.max(0, T - last)); last = T;
    floor = Math.min(floor + dt * .02, vol); peak = Math.max(peak - dt * .05, vol, floor + .08);
    return Math.max(0, Math.min(1, (vol - floor) / (peak - floor))) ** 1.2; }; };
const ins = norm(), outs = norm();
const band = (f, lo, hi) => { const a = Math.round((lo - 100) / 7900 * f.length), b = Math.round((hi - 100) / 7900 * f.length);
  let s = 0; for (let i = a; i < b; i++) s += f[i]; return s / (b - a); };
head.setLevel(T => {
  if (!call) return 0;
  if (mode !== 'speaking') return ins(call.getInputVolume(), T);
  const f = call.getOutputByteFrequencyData();
  return { v: outs(call.getOutputVolume(), T), wide: Math.max(0, Math.min(1, (band(f, 1700, 3500) - band(f, 250, 900) + 110) / 70)) };
});

// Эмоции по смыслу. Агент ставит в реплику теги ElevenLabs ([laughs], [smugly]…): голос их отыгрывает, а текст
// реплики приходит сюда (onMessage). Голова отыгрывает их же, плюс голова набок на вопросе и кивок на «!».
// Время — по месту в тексте и скорости речи; скорость подстраивается: длина реплики / сколько он её говорил.
const MOODS = { laughs: 'laugh', giggles: 'laugh', chuckles: 'laugh', happily: 'laugh', mischievously: 'smug', smugly: 'smug',
                excited: 'excited', surprised: 'excited', purrs: 'purr', meows: 'meow', curious: 'ask' };
let rate = 14, turn = null, cues = [];
const cueTimes = text => {
  const out = []; let plain = '', m; const re = /\[([a-z ]+)\]\s*/gi; let last = 0;
  while ((m = re.exec(text))) { plain += text.slice(last, m.index); last = re.lastIndex;
    const mood = MOODS[m[1].trim().toLowerCase()]; if (mood) out.push({ at: plain.length, mood, dur: mood === 'laugh' ? 1.4 : 1.8 }); }
  plain += text.slice(last);
  // Вопрос: голова набок на последних словах; «!»: кивок на конце.
  for (const q of plain.matchAll(/[?!]/g)) out.push(q[0] === '?' ? { at: Math.max(0, q.index - 14), mood: 'ask', dur: 1.3 } : { at: Math.max(0, q.index - 4), mood: 'exclaim' });
  return { plain, out };
};
const schedule = () => {
  if (!turn?.start || !turn.cues) return;
  turn.cues.forEach(c => { const due = turn.start + c.at / rate * 1000 - performance.now();
    if (due > -600) cues.push(setTimeout(() => head.emote(c.mood, c.dur), Math.max(0, due))); });
  turn.cues = null;
};
const newTurn = () => {
  // Скорость речи по прошлой реплике: только если она длинная и он её точно договорил.
  if (turn?.start && turn.end && turn.len > 40) { const sec = (turn.end - turn.start) / 1000; if (sec > 1.5) rate = Math.min(22, Math.max(9, .7 * rate + .3 * turn.len / sec)); }
  turn = { start: mode === 'speaking' ? performance.now() : null, end: null, len: 0, cues: null };
};
// Временная диагностика синхронизации (24.10): в логе nginx видно, когда пришёл текст реплики относительно начала
// речи (ms, отрицательное — до неё) и приходят ли тайминги букв ElevenLabs. Убрать, когда разберёмся.
const diag = q => fetch(`/diag?${new URLSearchParams(q)}`, { keepalive: true }).catch(() => {});
let aligns = 0;
const heard = ({ source, role, message }) => {
  if (role === 'agent') diag({ ev: 'msg', speaking: mode, ms: turn?.start ? Math.round(performance.now() - turn.start) : 'none', len: (message || '').length, tags: ((message || '').match(/\[[a-z ]+\]/gi) || []).join(''), rate: rate.toFixed(1), aligns, old: turn?.len ? 1 : 0 });
  if (source === 'user' || role === 'user') { cues.forEach(clearTimeout); cues = []; turn = null; return; }
  if (!turn || turn.len) newTurn();
  const { plain, out } = cueTimes(message || ''); turn.len = plain.length; turn.cues = out; schedule();
};
const spoke = next => {
  // Новая реплика — если прошлая уже прозвучала и он молчал дольше 1,2 с (паузы между фразами — та же реплика).
  if (next === 'speaking') { if (!turn || turn.len && turn.end && performance.now() - turn.end > 1200) newTurn(); if (!turn.start) { turn.start = performance.now(); schedule(); } turn.end = null; }
  else if (turn?.start) turn.end = performance.now();
};

const say = (text, mono = false) => { status.textContent = text; status.classList.toggle('timer', mono); };
const haptic = kind => tg?.HapticFeedback?.impactOccurred?.(kind);
const live = on => { button.classList.toggle('live', on); button.setAttribute('aria-label', on ? 'Завершить' : 'Позвонить'); };
const clock = on => {
  clearInterval(timer); timer = null; if (!on) return;
  const t0 = Date.now(), tick = () => { const s = Math.floor((Date.now() - t0) / 1000); say(`${String(s / 60 | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`, true); };
  tick(); timer = setInterval(tick, 1000);
};
const fail = text => { failed = true; clock(false); head.set('dizzy'); say(text); };

async function start() {
  if (!tg?.initData) return say('открой меня из Telegram');
  busy = true; button.disabled = true; haptic('medium'); say(''); head.set('ringing'); live(true);
  mode = 'listening'; thinking = false; failed = false; turn = null;
  try {
    const res = await fetch(START, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                     body: JSON.stringify({ initData: tg.initData }) });
    if (!res.ok) throw new Error(res.status === 403 ? 'это не твой Морзик' : `сервер ответил ${res.status}`);
    const { conversationToken, dynamicVariables } = await res.json();
    call = await Conversation.startSession({
      conversationToken, connectionType: 'webrtc', dynamicVariables,
      onConnect: () => { clock(true); show(); },
      onModeChange: next => { mode = next.mode; spoke(mode); show(); },
      onMessage: heard,
      onAudioAlignment: () => { aligns++; },
      onInterruption: () => { cues.forEach(clearTimeout); cues = []; },
      // Инструмент мозга: пока он работает, Морзик думает (заполнитель перед ним он при этом говорит).
      onAgentToolRequest: ({ tool_name }) => { if (tool_name !== 'end_call') { thinking = true; show(); } },
      onAgentToolResponse: () => { thinking = false; show(); },
      onDisconnect: details => {
        call = null; live(false);
        if (failed) return; // ошибка уже на экране, пусть остаётся
        if (details?.reason === 'error') return fail(`связь оборвалась${details.message ? `: ${details.message}` : ''}`);
        clock(false); head.set('idle'); say('звонок закончен');
      },
      onError: message => fail(`ошибка: ${message}`),
    });
  } catch (error) {
    call = null; live(false);
    fail(/Permission|NotAllowed/i.test(String(error)) ? 'нужен доступ к микрофону' : `не вышло: ${error.message || error}`);
  } finally {
    busy = false; button.disabled = false;
  }
}

async function stop() {
  haptic('light');
  await call?.endSession();
}

button.addEventListener('click', () => { if (!busy) (call ? stop : start)(); });
</script>
</body>
</html>
