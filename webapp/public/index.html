<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Морзик</title>
<script>
  // ВРЕМЕННО: диагностика полного экрана на телефоне — ошибки и состояние Telegram.WebApp уходят в лог nginx как /diag?…
  window.__errs = [];
  addEventListener('error', e => __errs.push((e.message || 'resource ' + (e.target && (e.target.src || e.target.href))) + ''), true);
  addEventListener('unhandledrejection', e => __errs.push('rej ' + e.reason));
  function __diag(tag) {
    const t = window.Telegram && Telegram.WebApp, d = { tag, hash: location.hash.slice(0, 120), proxy: !!window.TelegramWebviewProxy, errs: __errs };
    if (t) Object.assign(d, { v: t.version, pl: t.platform, init: (t.initData || '').length, exp: t.isExpanded, fs: t.isFullscreen, vh: t.viewportHeight, vsh: t.viewportStableHeight });
    new Image().src = '/diag?' + encodeURIComponent(JSON.stringify(d));
  }
  setTimeout(() => __diag('t0'), 50); setTimeout(() => __diag('t2'), 2000);
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Unbounded:wght@600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { height: 100%; background: #10172C; color: #fff; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden }
  body {
    background: radial-gradient(120% 70% at 50% 34%, #34477C 0%, #1a2342 55%, #10172C 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    /* In fullscreen Telegram draws its Close and ⋯ buttons over the page: the content safe area keeps clear of them. */
    padding: calc(24px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)) 24px calc(56px + var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px));
    text-align: center; user-select: none; -webkit-user-select: none;
  }
  .cat { position: relative; width: min(82vw, 46vh, 360px); aspect-ratio: 1; pointer-events: none }
  .cat video, .cat img { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
  .cat video, .cat.on img { opacity: 0 }
  .cat.on video { opacity: 1 }
  h1 { font-family: Unbounded, Inter, sans-serif; font-weight: 600; font-size: 34px; letter-spacing: -.01em; margin-top: 8px }
  p { margin-top: 12px; font-size: 16px; line-height: 1.45; color: #b9c3e6 }
</style>
</head>
<body>
  <div class="cat"><img src="morzik-dizzy.png" alt=""><video id="v" muted loop autoplay playsinline preload="auto"></video></div>
  <h1>Скоро</h1>
  <p>тут будет всё, что Морзик умеет,<br>а пока у него голова кругом</p>
<script>
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand(); tg.setHeaderColor('#10172C'); tg.setBackgroundColor('#10172C'); tg.setBottomBarColor?.('#10172C');
    // Full screen on phones (Bot API 8.0+); on a Mac or PC it would take over the whole monitor, so there it stays a window.
    if (['ios', 'android'].includes(tg.platform) && tg.isVersionAtLeast?.('8.0')) tg.requestFullscreen();
    tg.onEvent?.('fullscreenFailed', e => { __errs.push('fsFailed ' + (e && e.error)); __diag('fsfail'); });
  }

  // Голова — видео с прозрачным фоном: Safari и Telegram на iPhone/Mac (WebKit) показывают прозрачность только у HEVC,
  // Chrome и Telegram на Android — у VP9 WebM. Пока видео грузится, стоит первый кадр картинкой.
  const ua = navigator.userAgent, webkit = /AppleWebKit/.test(ua) && !/Chrome|CriOS|Android/.test(ua);
  const v = document.getElementById('v');
  v.muted = true;
  v.src = webkit ? 'morzik-dizzy.mov' : 'morzik-dizzy.webm';
  v.addEventListener('playing', () => v.parentElement.classList.add('on'), { once: true });
  v.play().catch(() => {});
</script>
</body>
</html>
