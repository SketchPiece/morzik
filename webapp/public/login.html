<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Вход — Морзик</title>
<script src="telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { height: 100%; background: #10172C; color: #fff; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden }
  /* The body follows the visible part of the page (visualViewport): with the keyboard up it gets shorter. */
  body {
    position: fixed; left: 0; right: 0; top: var(--vv-top, 0px); height: var(--vv-height, 100%);
    display: flex; flex-direction: column;
    padding: calc(8px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)) 0 calc(8px + var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px));
  }
  header { padding: 8px 16px 10px; text-align: center }
  h1 { font-size: 17px; font-weight: 600 }
  #status { margin-top: 4px; font-size: 14px; color: #b9c3e6; min-height: 1.4em }
  #screen { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #0a0f1f }
  #vnc { position: absolute; inset: 0 }
  #vnc > div { background: #0a0f1f !important }
  /* Shaped like the phone: the screen is the phone's size and stays so; the keyboard only hides its bottom. */
  .shaped #vnc { right: auto; bottom: auto }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; color: #b9c3e6; font-size: 15px; line-height: 1.45 }
  .center img { width: 120px; height: 120px }
  button { border: 0; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 500; color: #fff; background: #2a3763; padding: 12px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent }
  button:active { transform: scale(.97) }
  button.main { background: #2fbf71 }
  footer { display: none; padding: 10px 12px 0; gap: 8px; flex-direction: column }
  footer.on { display: flex }
  .row { display: flex; gap: 8px }
  .row button { flex: 1 }
  #type { width: 100%; border: 1px solid #34477C; border-radius: 12px; background: #1a2342; color: #fff; font: inherit; font-size: 16px; padding: 11px 14px; outline: none }
  #type::placeholder { color: #7f8bb5 }
  #clip { display: flex; gap: 8px; align-items: center; font-size: 14px; color: #b9c3e6 }
  #clip span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  #clip button { padding: 8px 12px; font-size: 14px }
  [hidden] { display: none !important }
</style>
</head>
<body>
  <header><h1 id="title">Экран Морзика</h1><p id="status"></p></header>
  <div id="screen">
    <div id="vnc"></div>
    <div class="center" id="intro">
      <img src="morzik-dizzy.png" alt="">
      <p id="introText">Секунду…</p>
      <button class="main" id="retry" hidden>Ещё раз</button>
    </div>
  </div>
  <footer id="controls">
    <div id="clip" hidden><span id="clipText"></span><button id="clipCopy">Скопировать</button></div>
    <input id="type" type="text" placeholder="Печатай сюда — уйдёт в браузер" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
    <div class="row">
      <button id="zoom">Крупно</button>
      <button id="keyboard" hidden aria-label="Клавиатура">⌨︎</button>
      <button id="cancel">Не сейчас</button>
      <button class="main" id="done">Готово</button>
    </div>
  </footer>
<script type="module">
// Вход на сайт в браузере Морзика. Три ключа сразу: Tailscale (до сервера можно добраться только из tailnet,
// с телефона пользователя), подпись Telegram (initData) и Face ID (ключ устройства, который Telegram отдаёт
// только после Face ID). Пароль VNC сервер подставляет сам. Подробнее — login/gate.py.
const GATE = 'https://sketch-server.<tailnet>.ts.net:6080';
// In the Morzik App (iPhone) the app provides the same calls: its token instead of initData, Face ID through the Keychain.
const app = window.MorzikApp || null;
const tg = app || (window.Telegram && Telegram.WebApp);
const bm = tg?.BiometricManager;
const $ = id => document.getElementById(id);
const requestId = new URLSearchParams(location.search).get('r') || '';
let rfb = null, session = null, keysyms = null, finished = false;
// From a phone or a tablet Morzik's screen takes the device's shape: its size and pixels, a mobile Chrome with
// touch. The app's own keyboard (MorzikApp.keyboard) opens by itself when a field on the screen gets the focus.
const touch = !!app || matchMedia('(pointer: coarse)').matches;
const nativeKeyboard = app?.keyboard?.native === true;
let shaped = false, events = null, full = null, keyboardOpen = false, lastSize = '', sizeTimer = 0, hideTimer = 0;

if (tg) {
  tg.ready(); tg.expand(); tg.setHeaderColor('#10172C'); tg.setBackgroundColor('#10172C'); tg.setBottomBarColor?.('#10172C');
  if (['ios', 'android'].includes(tg.platform) && tg.isVersionAtLeast?.('8.0')) tg.requestFullscreen();
  tg.disableVerticalSwipes?.();  // a swipe on the screen should move the mouse, not close the app
}

const say = text => { $('status').textContent = text; };
const haptic = kind => tg?.HapticFeedback?.notificationOccurred?.(kind);
function stop(text, retry = true) {
  $('intro').hidden = false; $('introText').textContent = text; $('retry').hidden = !retry; say('');
}

class Refused extends Error {}
async function gate(path, body) {
  let res;
  try {
    res = await fetch(GATE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ initData: tg.initData, ...(tg.appToken ? { appToken: tg.appToken } : {}), ...body }) });
  } catch {
    throw new Refused('Не достучался до сервера. Включи Tailscale на телефоне и нажми «Ещё раз».');
  }
  const data = await res.json().catch(() => ({}));
  if (res.ok) return data;
  const why = {
    device: 'Это устройство не пускаю: нужен твой телефон в Tailscale.',
    telegram: 'Telegram не подтвердил, что это ты. Открой кнопку из чата заново.',
    app: 'Приложение не подтвердило, что это ты. Войди в него заново.',
    telegram_user: 'Это не твой Морзик.',
    enroll_closed: 'Этот телефон я не знаю, а новый можно добавить, только если открыть окно на сервере: gate.py allow-enroll.',
  }[data.error];
  const error = new Refused(why || `Сервер ответил ${res.status}.`);
  error.code = data.error;
  throw error;
}

const bmCall = (method, ...args) => new Promise(resolve => bm[method](...args, (...result) => resolve(result)));

async function faceKey(canEnroll) {
  if (!bm || !tg.isVersionAtLeast?.('7.2')) throw new Refused('Обнови Telegram: нужен вход по Face ID.');
  if (!bm.isInited) await bmCall('init');
  if (!bm.isBiometricAvailable) throw new Refused(tg.appToken ? 'Не вижу Face ID на этом устройстве: включи его в настройках телефона.'
                                                               : 'Telegram не видит Face ID на этом устройстве. Открой с телефона.');
  if (!bm.isAccessGranted) {
    if (bm.isAccessRequested) {
      $('retry').textContent = 'Разрешить Face ID';
      $('retry').onclick = () => bm.openSettings();
      throw new Refused('Разреши Морзику Face ID в настройках и вернись сюда.');
    }
    const [granted] = await bmCall('requestAccess', { reason: 'Чтобы пускать тебя на экран Морзика' });
    if (!granted) throw new Refused('Без Face ID не пущу.');
  }
  if (!bm.isBiometricTokenSaved) {
    if (!canEnroll) throw new Refused('Этот телефон я не знаю, а новый можно добавить, только если открыть окно на сервере: gate.py allow-enroll.');
    say('запоминаю этот телефон…');
    const { deviceKey } = await gate('/login/enroll', { deviceId: bm.deviceId || '' });
    const [saved] = await bmCall('updateBiometricToken', deviceKey);
    if (!saved) throw new Refused('Не получилось сохранить ключ под Face ID.');
  }
  const [ok, key] = await bmCall('authenticate', { reason: 'Открыть экран Морзика' });
  if (!ok || !key) throw new Refused('Face ID не подтвердился.');
  return key;
}

async function open() {
  $('retry').hidden = true; $('retry').textContent = 'Ещё раз'; $('retry').onclick = open;
  $('introText').textContent = 'Секунду…';
  if (!tg?.initData) return stop('Открой меня кнопкой из чата с Морзиком.', false);
  try {
    say('проверяю…');
    const state = await gate('/login/state', { request: requestId });
    if (state.request) $('title').textContent = `Вход в ${state.request.site}`;
    let reply;
    try {
      reply = await gate('/login/session', { deviceKey: await faceKey(state.canEnroll), request: requestId });
    } catch (error) {
      if (error.code !== 'device_key' || !state.canEnroll) throw error;
      await bmCall('updateBiometricToken', '');  // the gate forgot this key: set the phone up again
      reply = await gate('/login/session', { deviceKey: await faceKey(true), request: requestId });
    }
    session = reply.session;
    if (touch) await shape();
    await connect(reply);
  } catch (error) {
    stop(error instanceof Refused ? error.message : `Не вышло: ${error.message || error}`);
  }
}

// The page's size goes to the gate: the screen area in CSS pixels (its full height, and the visible part while
// the keyboard is up), devicePixelRatio for sharpness, phone or tablet. The gate resizes Morzik's screen to
// exactly these pixels, so noVNC shows it pixel for pixel; the keyboard only shortens Chrome's viewport.
function fitBody() {
  const vv = window.visualViewport;
  document.documentElement.style.setProperty('--vv-height', `${vv ? vv.height : innerHeight}px`);
  document.documentElement.style.setProperty('--vv-top', `${vv ? vv.offsetTop : 0}px`);
}
function measure() {
  const box = $('screen').getBoundingClientRect();
  const width = Math.round(box.width), height = Math.round(box.height);
  if (!full || !keyboardOpen || width !== full.width) full = { width, height };
  $('vnc').style.width = `${full.width}px`; $('vnc').style.height = `${full.height}px`;
  return { width: full.width, height: full.height, visible: Math.min(height, full.height), dpr: devicePixelRatio,
           device: app?.device || (Math.min(innerWidth, innerHeight) >= 600 ? 'tablet' : 'phone') };
}
async function sendSize(force = false) {
  const size = measure(), key = JSON.stringify(size);
  if (key === lastSize && !force) return;
  lastSize = key;
  await gate('/login/screen', { session, ...size });
}
function sizeChanged() {
  fitBody();
  if (!shaped) return;
  clearTimeout(sizeTimer);
  sizeTimer = setTimeout(() => sendSize().catch(() => {}), 250);
}
window.visualViewport?.addEventListener('resize', sizeChanged);
window.visualViewport?.addEventListener('scroll', fitBody);
addEventListener('resize', sizeChanged);
addEventListener('orientationchange', sizeChanged);
fitBody();

async function shape() {
  say('подстраиваю экран…');
  document.body.classList.add('shaped');
  $('controls').classList.add('on');  // before measuring: the buttons take their place from the start
  $('zoom').hidden = true;
  if (nativeKeyboard) { $('type').hidden = true; $('keyboard').hidden = false; }
  // Events from the gate: a field on the screen got or lost the focus. While this stream is open the screen
  // keeps the phone's shape; once it is gone for a while (app closed), the gate puts the desktop back.
  events?.close();
  events = new EventSource(`${GATE}/login/events?session=${encodeURIComponent(session)}`);
  events.onmessage = event => onGateEvent(JSON.parse(event.data));
  events.onopen = () => { if (shaped) sendSize(true).catch(() => {}); };  // after a reconnect
  try {
    await sendSize(true);
    shaped = true;
  } catch {
    // Chrome did not answer: the desktop screen as before.
    events.close(); events = null;
    document.body.classList.remove('shaped'); $('zoom').hidden = false;
    $('vnc').style.width = $('vnc').style.height = '';
  }
}

function onGateEvent(event) {
  if (event.type === 'focus') event.field ? showKeyboard(event.field) : hideKeyboardSoon();
  else if (event.type === 'end') {
    events?.close(); events = null; shaped = false;
    if (event.reason === 'replaced' && !finished) { rfb?.disconnect(); stop('Экран открыли на другом устройстве.'); }
  }
}

function setKeyboard(open) { keyboardOpen = open; sizeChanged(); }
function showKeyboard(field) {
  clearTimeout(hideTimer);
  if (nativeKeyboard) {
    app.keyboard.show({ type: field.type, enter: field.enter || undefined, code: !!field.code });
    setKeyboard(true);
    return;
  }
  // Telegram: the field under the screen takes the layout of the field on the screen. The phone may not open
  // the keyboard without a tap on it, but a keyboard already open stays and switches.
  const type = $('type');
  type.type = field.type === 'password' ? 'password' : 'text';
  type.inputMode = { number: 'numeric', tel: 'tel', email: 'email', url: 'url', search: 'search' }[field.type] || 'text';
  type.enterKeyHint = field.enter || 'send';
  type.autocomplete = field.code ? 'one-time-code' : field.type === 'password' ? 'current-password' : 'off';
  type.focus({ preventScroll: true });
}
function hideKeyboardSoon() {
  // Focus moving between fields (or into an iframe) comes as "lost" then "got": wait a moment.
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (nativeKeyboard) { app.keyboard.hide(); setKeyboard(false); }
    else if (document.activeElement === $('type')) $('type').blur();
  }, 300);
}
if (nativeKeyboard) {
  app.keyboard.onInput = input => {
    if (!rfb) return;
    if (input.text) typeText(input.text);
    else if (input.key === 'Backspace') rfb.sendKey(0xff08, 'Backspace');
    else if (input.key === 'Enter') rfb.sendKey(0xff0d, 'Enter');
  };
  app.keyboard.onClose = () => setKeyboard(false);  // the user put it away: the focus on the screen stays
  $('keyboard').addEventListener('click', () => {  // for fields the focus watch does not see (canvas and such)
    app.keyboard.show({ type: 'text' }); setKeyboard(true);
  });
}
$('type').addEventListener('focus', () => { if (!nativeKeyboard) setKeyboard(true); });
$('type').addEventListener('blur', () => { if (!nativeKeyboard) setKeyboard(false); });

// Clipboard both ways. Copied on the screen -> the phone (the app writes it; in Telegram a tap on «Скопировать»,
// since a web page may only write the clipboard on a tap). The phone's clipboard -> the screen on connect and
// whenever the user comes back to the app with something new.
let clip = null;
function toScreenClipboard(text) {
  if (!text || !rfb || text === clip) return;
  clip = text;
  rfb.clipboardPasteFrom(text);
}
function fromScreenClipboard(text) {
  if (!text || text === clip) return;
  clip = text;
  if (app?.clipboard) return app.clipboard.write(text);
  $('clipText').textContent = `Скопировано: ${text}`;
  $('clip').hidden = false;
  $('clipCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const area = Object.assign(document.createElement('textarea'), { value: text });
      document.body.append(area); area.select(); document.execCommand('copy'); area.remove();
    }
    $('clip').hidden = true; haptic('success');
  };
}

async function connect({ ticket, password, request }) {
  say('подключаюсь…');
  const [{ default: RFB }, keysymdef] = await Promise.all([
    import(`${GATE}/novnc/core/rfb.js`), import(`${GATE}/novnc/core/input/keysymdef.js`)]);
  keysyms = keysymdef.default;
  rfb = new RFB($('vnc'), `${GATE.replace('https', 'wss')}/login/ws?ticket=${encodeURIComponent(ticket)}`,
                { credentials: { password } });
  rfb.scaleViewport = true;
  rfb.background = '#0a0f1f';
  if (shaped) {
    // A tap is a tap on the screen, not a grab of the keyboard focus: the phone's keyboard stays as it is.
    rfb.focusOnClick = false;
  }
  rfb.addEventListener('connect', async () => {
    $('intro').hidden = true; $('controls').classList.add('on'); haptic('success');
    say(request ? (request.waiting ? 'войди и нажми «Готово»' : 'Морзик уже не ждёт этого входа') : 'экран Морзика');
    if (app?.clipboard) {
      app.clipboard.onChange = toScreenClipboard;
      toScreenClipboard(await app.clipboard.read().catch(() => null));
    }
  });
  rfb.addEventListener('clipboard', event => fromScreenClipboard(event.detail.text));
  rfb.addEventListener('disconnect', event => {
    rfb = null; $('controls').classList.remove('on');
    events?.close(); events = null; shaped = false;
    if (!finished) stop(event.detail.clean ? 'Экран закрыт.' : 'Связь с экраном пропала.');
  });
  rfb.addEventListener('securityfailure', () => stop('Сервер не принял пароль экрана.'));
}

// One finger scrolls the page (Chrome turns the drag into touch), a tap clicks, two fingers scroll too.
// Pinch would be Ctrl+wheel, which zooms the site in Chrome and stays after the login: not passed on.
for (const kind of ['gesturestart', 'gesturemove', 'gestureend']) {
  $('screen').addEventListener(kind, event => {
    if (shaped && event.detail?.type === 'pinch') event.stopImmediatePropagation();
  }, true);
}

// Typing: the field is the phone keyboard; each character goes to the screen as a key press.
// Paste (long tap → Вставить) works the same way, so a password from 1Password goes in without the chat.
function typeText(text) {
  for (const ch of text) {
    const keysym = ch === '\n' ? 0xff0d : keysyms.lookup(ch.codePointAt(0));
    rfb?.sendKey(keysym, null);
  }
}
$('type').addEventListener('beforeinput', event => {
  if (!rfb) return;
  event.preventDefault();
  const kind = event.inputType;
  if (kind === 'deleteContentBackward') rfb.sendKey(0xff08, 'Backspace');
  else if (kind === 'insertLineBreak' || kind === 'insertParagraph') rfb.sendKey(0xff0d, 'Enter');
  else if (kind === 'insertFromPaste') {
    const text = event.dataTransfer?.getData('text/plain') || event.data || '';
    toScreenClipboard(text);  // so a paste on the screen itself works too
    typeText(text);
  }
  else if (event.data) typeText(event.data);
});
$('type').addEventListener('input', event => {  // AutoFill and one-time codes may fill the field without beforeinput
  if (event.isComposing || /Composition/.test(event.inputType || '')) return;
  const type = $('type');
  if (rfb && type.value) typeText(type.value);
  type.value = '';
});
$('type').addEventListener('keydown', event => {
  if (!rfb) return;
  const special = { Enter: 0xff0d, Tab: 0xff09, Backspace: 0xff08 }[event.key];
  if (special && !event.isComposing) { event.preventDefault(); rfb.sendKey(special, event.key); }
});

$('zoom').addEventListener('click', () => {
  if (!rfb) return;
  const fit = !rfb.scaleViewport;
  rfb.scaleViewport = fit; rfb.clipViewport = !fit; rfb.dragViewport = !fit;
  $('zoom').textContent = fit ? 'Крупно' : 'Целиком';
  say(fit ? 'весь экран' : 'крупно: двигай пальцем, тап — клик');
});

async function finish(outcome) {
  finished = true;
  try {
    const { heard } = session ? await gate('/login/done', { session, outcome }) : { heard: false };
    events?.close(); events = null;
    if (nativeKeyboard) app.keyboard.hide();
    rfb?.disconnect();
    stop(heard ? (outcome === 'done' ? 'Готово, Морзик продолжает.' : 'Ок, Морзик понял.')
               : 'Морзик уже не ждёт: напиши ему в чат.', false);
    if (heard) setTimeout(() => tg.close(), 1200);
  } catch (error) {
    finished = false;
    say(error.message || 'не вышло, попробуй ещё раз');
  }
}
$('done').addEventListener('click', () => finish('done'));
$('cancel').addEventListener('click', () => finish('cancel'));
$('retry').onclick = open;

open();
</script>
</body>
</html>
